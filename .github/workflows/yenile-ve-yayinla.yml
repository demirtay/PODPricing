# Fiyatları 6 saatte bir yeniler, siteyi üretir ve Netlify'a yayınlar.
# Gerekli depo sırları: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
name: Yenile ve yayinla
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'web/**', 'site.config.json']

concurrency:
  group: yenile-yayinla
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ürün detay sayfaları 24 saat önbellekte tutulur; her çalışmada baştan indirilmez.
      - name: Kaynak önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: data/source-cache
          key: source-cache-${{ github.run_id }}
          restore-keys: source-cache-
      - name: Katalogları yenile
        if: github.event_name != 'push'
        run: node scripts/refresh-once.cjs
      - name: Katalogu doğrula
        run: node scripts/catalog-import.cjs
      - name: Güncel katalogu kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "pod-atlas-bot"
          git config user.email "pod-atlas-bot@users.noreply.github.com"
          git add data/catalog.json data/refresh-status.json
          git diff --cached --quiet || (git commit -m "data: otomatik fiyat yenileme" && git push)
      - name: Siteyi üret
        run: node scripts/build-site.cjs
      - name: Netlify'a yayınla
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir site --message "otomatik yayin ${{ github.run_number }}"
