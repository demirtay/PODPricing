# Fiyatları günde 2 kez (06:17 ve 18:17 UTC) yeniler, siteyi üretir ve GitHub Pages'e yayınlar.
# (Netlify ücretsiz planı yayın başına kredi düştüğü için 2026-10-05'te GitHub Pages'e geçildi.)
name: Yenile ve yayinla
on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'web/**', 'site.config.json', '.github/workflows/**']

concurrency:
  group: yenile-yayinla
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ürün detay sayfaları 24 saat önbellekte tutulur; her çalışmada baştan indirilmez.
      - name: Kaynak önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: data/source-cache
          key: source-cache-${{ github.run_id }}
          restore-keys: source-cache-
      # Fiyat endeksi geçmişi (günlük anlık görüntüler): git'e gönderilemese bile çalışmalar arasında korunur
      - name: Fiyat geçmişini geri yükle
        uses: actions/cache@v4
        with:
          path: data/price-history.json
          key: price-history-${{ github.run_id }}
          restore-keys: price-history-
      - name: Katalogları yenile
        if: github.event_name != 'push'
        env:
          REFRESH_BUDGET_MIN: '100'
        run: node scripts/refresh-once.cjs
      - name: Katalogu doğrula
        run: node scripts/catalog-import.cjs
      - name: Güncel katalogu kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "pod-atlas-bot"
          git config user.email "pod-atlas-bot@users.noreply.github.com"
          git add data/catalog.json data/refresh-status.json
          git diff --cached --quiet || git commit -m "data: otomatik fiyat yenileme"
          # çalışma sırasında başka bir değişiklik gönderildiyse önce onu al (en çok 3 deneme)
          ok=0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || echo "::warning::Güncel katalog GitHub'a gönderilemedi (git push başarısız)"
      - name: Siteyi üret
        run: node scripts/build-site.cjs
      - name: Fiyat geçmişini kaydet
        if: github.event_name != 'push'
        run: |
          git add data/price-history.json
          git diff --cached --quiet && exit 0
          git commit -m "data: fiyat endeksi anlık görüntüsü"
          ok=0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || echo "::warning::Fiyat geçmişi GitHub'a gönderilemedi (git push başarısız)"
      - name: Yayın paketini hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: GitHub Pages'e yayınla
        id: deploy
        uses: actions/deploy-pages@v4
      # Bing/Yandex'e güncellenen sayfaları bildir (hata olursa yayını bozmaz)
      - name: IndexNow bildirimi
        continue-on-error: true
        run: sleep 60 && node scripts/indexnow.cjs
